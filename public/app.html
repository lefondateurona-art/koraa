<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>KORAA — Le commerce social d'Afrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --beige:#FFC98A;
  --beige-dark:#F4903B;
  --cream:#FFFBF7;
  --beige-light:#FFF1E2;
  --ink:#201510;
  --grey:#3a2c22;
  --grey-soft:#8a6f5c;
  --gold:#E8770D;
  --gold-dark:#B8560A;
  --gold-soft:rgba(232,119,13,.14);
  --white:#ffffff;
  --line:#f2ddc4;
  --danger:#b64437;
  --success:#3f7d5c;
  --feed-bg:#160f0a;
  --feed-card:#241611;
  --feed-line:#3d281c;
  --r-xl:26px;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --sh-soft:0 14px 34px -16px rgba(28,20,10,.22);
  --sh-card:0 10px 24px -14px rgba(28,20,10,.28);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4,h5{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-0.01em;line-height:1.15;color:var(--ink);}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
::selection{background:var(--gold);color:#fff;}
:focus-visible{outline:2px solid var(--gold-dark);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.hidden{display:none !important;}
.mono-num{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;}

/* ============ APP FRAME (mobile-first, centered on desktop) ============ */
#koraa-root{
  height:100%;
  width:100%;
  display:flex;
  align-items:stretch;
  justify-content:center;
  background:linear-gradient(160deg,#FFE7C7,#FFB768 55%,#F4903B);
  position:relative;
  overflow:hidden;
}
#phone-frame{
  position:relative;
  width:100%;
  max-width:460px;
  height:100%;
  max-height:960px;
  margin:auto;
  background:var(--cream);
  overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(28,20,10,.45);
  z-index:2;
}
@media (min-width:560px){
  #phone-frame{ margin:18px auto; height:calc(100% - 36px); border-radius:38px; border:8px solid #1c1c1c; }
}
/* ---------- Tablette (561px – 1024px) : cadre un peu plus grand, aéré ---------- */
@media (min-width:561px) and (max-width:1024px){
  #phone-frame{ max-width:420px; max-height:880px; }
}
/* ---------- Écran géant / grand moniteur (≥1600px) : cadre agrandi + habillage de fond ---------- */
@media (min-width:1600px){
  #phone-frame{ max-width:480px; max-height:1000px; border-width:10px; }
  #koraa-root::before{
    content:'KORAA';
    position:absolute; left:8%; top:50%; transform:translateY(-50%);
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:96px;
    color:rgba(255,255,255,.16); letter-spacing:-0.02em; pointer-events:none;
  }
  #koraa-root::after{
    content:'Le commerce social d\'Afrique';
    position:absolute; left:8%; top:calc(50% + 62px);
    font-family:'Inter',sans-serif; font-weight:600; font-size:17px;
    color:rgba(255,255,255,.55); letter-spacing:.02em; pointer-events:none;
  }
}

/* ============ TOP STATUS-ISH BAR (brand) ============ */
.view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  background:var(--cream);
  opacity:0;pointer-events:none;
  transform:translateY(6px);
  transition:opacity .22s ease, transform .22s ease;
}
.view.active{opacity:1;pointer-events:auto;transform:translateY(0);}

.topbar{
  flex:none;
  display:flex;align-items:center;gap:10px;
  padding:16px 18px 12px;
  background:var(--cream);
  border-bottom:1px solid transparent;
}
.topbar .brand{
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;letter-spacing:.01em;
  display:flex;align-items:center;gap:8px;
}
.brand .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
.topbar .tb-actions{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--beige-light);color:var(--grey);
  position:relative;flex:none;
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:active{transform:scale(.92);}
.icon-btn.on-dark{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px);}
.icon-btn .badge-dot{
  position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:2px solid var(--cream);
}
.icon-btn.on-dark .badge-dot{border-color:#1a1512;}

.page-title{font-size:22px;padding:2px 18px 12px;flex:none;}
.page-sub{font-size:13px;color:var(--grey-soft);padding:0 18px 10px;flex:none;margin-top:-8px;}

.view-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.view-scroll::-webkit-scrollbar{display:none;}

/* ============ BOTTOM NAV ============ */
#bottom-nav{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-around;
  padding:10px 6px calc(10px + var(--safe-bottom));
  background:rgba(250,248,245,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:40;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  width:56px;padding:4px 0;color:var(--grey-soft);
  transition:color .15s ease;
}
.nav-btn svg{width:22px;height:22px;}
.nav-btn span{font-size:10px;font-weight:600;letter-spacing:.01em;}
.nav-btn.active{color:var(--ink);}
.nav-btn.active svg{stroke:var(--gold-dark);}
.nav-btn.create-btn{
  width:46px;height:46px;border-radius:16px;
  background:linear-gradient(145deg,var(--gold),var(--gold-dark));
  color:#fff;justify-content:center;margin-top:-22px;
  box-shadow:0 10px 22px -8px rgba(184,86,10,.55);
}
.nav-btn.create-btn span{display:none;}
.nav-btn.create-btn svg{width:24px;height:24px;}

/* ============ BUTTONS / CHIPS (shared) ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:999px;font-weight:700;font-size:14.5px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-gold{background:linear-gradient(145deg,var(--gold),var(--gold-dark));color:#fff;box-shadow:0 10px 22px -10px rgba(184,86,10,.6);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline.on-dark{border-color:rgba(255,255,255,.3);color:#fff;}
.btn-ghost{background:var(--beige-light);color:var(--ink);}
.btn-sm{padding:9px 14px;font-size:13px;}
.btn-block{width:100%;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--beige-light);font-size:12.5px;font-weight:600;color:var(--grey);white-space:nowrap;}
.chip.active{background:var(--ink);color:#fff;}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-card);}

/* ============ ANIMATIONS GLOBALES ============ */
@keyframes koraa-fade-up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes koraa-pop{0%{opacity:0;transform:scale(.85);}70%{transform:scale(1.04);}100%{opacity:1;transform:scale(1);}}
@keyframes koraa-pulse-ring{0%{box-shadow:0 0 0 0 rgba(182,68,55,.55);}70%{box-shadow:0 0 0 8px rgba(182,68,55,0);}100%{box-shadow:0 0 0 0 rgba(182,68,55,0);}}
@keyframes koraa-shine{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes koraa-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes koraa-heart-burst{0%{transform:scale(.6);opacity:0;}45%{transform:scale(1.35);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes koraa-spin-slow{to{transform:rotate(360deg);}}
@keyframes koraa-count-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.shop-card,.product-card,.dash-row,.stat-tile,.badge-chip,.wizard-step,.campaign-card,.hashtag-pill,
.creator-mini,.conv-row,.notif-row,.history-row,.settings-row,.content-tile,.create-opt{
  animation:koraa-fade-up .38s cubic-bezier(.2,.7,.3,1) backwards;
}
.hscroll>*:nth-child(1),.product-grid>*:nth-child(1),.dash-list>*:nth-child(1),.content-grid>*:nth-child(1){animation-delay:.02s;}
.hscroll>*:nth-child(2),.product-grid>*:nth-child(2),.dash-list>*:nth-child(2),.content-grid>*:nth-child(2){animation-delay:.06s;}
.hscroll>*:nth-child(3),.product-grid>*:nth-child(3),.dash-list>*:nth-child(3),.content-grid>*:nth-child(3){animation-delay:.1s;}
.hscroll>*:nth-child(4),.product-grid>*:nth-child(4),.dash-list>*:nth-child(4),.content-grid>*:nth-child(4){animation-delay:.14s;}
.hscroll>*:nth-child(5),.product-grid>*:nth-child(5),.dash-list>*:nth-child(5),.content-grid>*:nth-child(5){animation-delay:.18s;}
.hscroll>*:nth-child(n+6),.product-grid>*:nth-child(n+6),.dash-list>*:nth-child(n+6),.content-grid>*:nth-child(n+6){animation-delay:.2s;}
.conv-row,.notif-row,.history-row,.settings-row{transition:background .15s ease;}
.conv-row:active,.notif-row:active{background:var(--beige-light);}
.pf-item,.profile-tab,.discover-tabs .chip,.chip-pick,.nav-btn{transition:transform .15s ease,color .15s ease,background .15s ease,border-color .15s ease;}
.pf-item:active,.chip-pick:active{transform:scale(.94);}
.profile-tab{transition:color .2s ease,border-color .2s ease;}
#profile-body{animation:koraa-fade-up .3s ease backwards;}

.feed-card{animation:koraa-pop .32s ease backwards;}
.icon-btn .badge-dot{animation:koraa-pulse-ring 1.8s ease-out infinite;}
.brand-dot{animation:koraa-pulse-ring 2.4s ease-out infinite;}
.nav-btn.create-btn{animation:koraa-bob 2.6s ease-in-out infinite;}
.nav-btn.create-btn:active{animation:none;}
.fsa-btn .fsa-circle{transition:transform .18s cubic-bezier(.4,0,.2,1.6), background .18s ease;}
.fsa-btn.liked .fsa-circle{animation:koraa-heart-burst .38s ease;}
.k-mark{animation:koraa-fade-up .5s ease backwards;}
.toast{animation:koraa-pop .28s ease;}
.sheet{animation:koraa-fade-up .28s cubic-bezier(.2,.7,.3,1);}
.mono-num,.st-val,.dr-val,.ssr-num,.pf-num{animation:koraa-count-in .3s ease backwards;}
.spin-loader{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.12);border-top-color:var(--gold-dark);animation:koraa-spin-slow .7s linear infinite;}
.live-badge-dot{width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block;animation:koraa-pulse-ring 1.4s ease-out infinite;}
@media (prefers-reduced-motion:reduce){.nav-btn.create-btn,.icon-btn .badge-dot,.brand-dot,.live-badge-dot{animation:none;}}

/* ============ AUTH / ONBOARDING ============ */
#view-auth{background:radial-gradient(120% 90% at 50% 0%,#FFF3E2,#FFCB93 70%,#F4903B);}
.auth-wrap{flex:1;display:flex;flex-direction:column;padding:40px 26px 26px;overflow-y:auto;}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px;}
.auth-logo .k-mark{
  width:64px;height:64px;border-radius:20px;
  background:linear-gradient(145deg,var(--ink),#3a2214);
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans';font-weight:800;color:var(--gold);font-size:26px;
  box-shadow:0 16px 30px -12px rgba(28,20,10,.5);
}
.auth-logo h1{font-size:27px;letter-spacing:.02em;}
.auth-logo p{font-size:13px;color:var(--grey-soft);text-align:center;max-width:260px;}
.auth-card{background:#fff;border-radius:var(--r-xl);padding:26px 22px;box-shadow:var(--sh-soft);}
.auth-tabs{display:flex;background:var(--beige-light);border-radius:999px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;text-align:center;padding:10px 0;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--grey-soft);}
.auth-tab.active{background:var(--ink);color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--grey-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);
  background:var(--beige-light);font-size:14.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);background:#fff;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip-pick{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--grey);}
.chip-pick.picked{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-dark);}
.auth-step-dots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px;}
.auth-step-dots span{width:7px;height:7px;border-radius:50%;background:var(--line);}
.auth-step-dots span.on{background:var(--gold);width:18px;border-radius:4px;}
.auth-foot-link{text-align:center;font-size:13px;color:var(--grey-soft);margin-top:16px;}
.auth-foot-link b{color:var(--gold-dark);}
.auth-error{display:none;background:rgba(182,68,55,.1);color:var(--danger);border:1px solid rgba(182,68,55,.25);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.4;}
.btn.is-loading{opacity:.75;pointer-events:none;position:relative;}
.btn.is-loading::after{content:"";position:absolute;right:16px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.consent-row{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--grey-soft);margin:14px 0;}
.consent-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--gold-dark);flex:none;}

/* ============ FEED ============ */
#view-feed{background:var(--feed-bg);}
.feed-scroll{
  flex:1;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
}
.feed-scroll::-webkit-scrollbar{display:none;}
.feed-topbar{
  position:absolute;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:16px 16px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,.18) 75%,transparent);
}
.feed-brand{display:flex;align-items:center;gap:7px;flex:none;}
.feed-brand .fb-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(255,255,255,.16);}
.feed-brand span{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:#fff;letter-spacing:.03em;}
.feed-tabs-group{display:flex;align-items:center;justify-content:center;gap:22px;flex:1;}
.feed-tab{font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;color:rgba(255,255,255,.55);position:relative;padding:4px 0;transition:color .2s ease,transform .15s ease;}
.feed-tab.active{color:#fff;}
.feed-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2.5px;background:var(--gold);border-radius:2px;animation:koraa-fade-up .22s ease;}
.feed-tab:active{transform:scale(.95);}
.feed-topbar .tb-actions{margin-left:0;gap:9px;}
.feed-topbar .icon-btn{width:36px;height:36px;}
.feed-topbar .icon-btn:hover{background:rgba(255,255,255,.22);}
.feed-card{
  position:relative;height:100%;width:100%;scroll-snap-align:start;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;
}
.feed-media{position:absolute;inset:0;z-index:0;}
.feed-media .fm-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.05) 0%, rgba(20,16,12,.15) 40%, rgba(15,12,9,.88) 100%);}
.feed-media .fm-badge{
  position:absolute;top:70px;left:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;letter-spacing:.03em;
  display:flex;align-items:center;gap:6px;
}
.feed-body{position:relative;z-index:1;padding:0 84px 18px 18px;color:#fff;}
.feed-shop-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.level-ring{
  width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--lvl,70)*1%), rgba(255,255,255,.18) 0);padding:2.5px;
}
.level-ring .lr-inner{
  width:100%;height:100%;border-radius:50%;background:#2a241d;display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans';font-weight:800;font-size:14px;color:#fff;
}
.feed-shop-row .fs-name{font-weight:700;font-size:14.5px;}
.feed-shop-row .fs-shop{font-size:11.5px;color:rgba(255,255,255,.65);}
.feed-follow-mini{margin-left:auto;padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);font-size:12px;font-weight:700;}
.feed-follow-mini.following{background:rgba(255,255,255,.18);border-color:transparent;}
.feed-desc{font-size:13.5px;line-height:1.5;margin-bottom:8px;max-width:88%;}
.feed-desc .tag{color:var(--gold);font-weight:700;}
.feed-music{display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(255,255,255,.75);margin-bottom:10px;}
.feed-product-ribbon{
  display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);border-radius:16px;padding:9px 12px;
  max-width:92%;box-shadow:0 12px 26px -10px rgba(0,0,0,.5);
}
.fpr-thumb{width:42px;height:42px;border-radius:10px;flex:none;}
.fpr-info{flex:1;min-width:0;}
.fpr-info .fpr-name{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fpr-price{display:flex;align-items:center;gap:6px;font-size:12.5px;}
.fpr-price .now{font-weight:800;color:var(--gold-dark);}
.fpr-price .was{text-decoration:line-through;color:var(--grey-soft);font-size:11px;}
.fpr-buy{background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;flex:none;}

.feed-side-actions{
  position:absolute;right:12px;bottom:88px;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;
}
.fsa-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;}
.fsa-btn .fsa-circle{
  width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease, background .15s ease;
}
.fsa-btn.liked .fsa-circle{background:rgba(197,58,58,.35);}
.fsa-btn:active .fsa-circle{transform:scale(.88);}
.fsa-btn span{font-size:11px;font-weight:700;}
.fsa-avatar{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--gold);position:relative;}
.fsa-avatar .plus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}

/* ============ DISCOVER ============ */
.search-bar{
  display:flex;align-items:center;gap:10px;background:var(--beige-light);border-radius:999px;
  padding:12px 16px;margin:0 18px 12px;color:var(--grey-soft);font-size:13.5px;
}
.discover-tabs{display:flex;gap:8px;padding:0 18px 14px;overflow-x:auto;flex:none;}
.discover-tabs::-webkit-scrollbar{display:none;}
.section-row{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px 12px;}
.section-row h3{font-size:16px;}

.hscroll{display:flex;gap:12px;padding:0 18px 22px;overflow-x:auto;}

.shop-card{

}
.shop-card .sc-cover{height:76px;position:relative;}
.shop-card .sc-logo{

}
.shop-card .sc-body{padding:22px 12px 14px;}
.shop-card .sc-name{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.shop-card .sc-cat{font-size:11px;color:var(--grey-soft);margin-bottom:8px;}
.sc-stats{display:flex;gap:10px;font-size:10.5px;color:var(--grey-soft);}
.premium-tag{
  position:absolute;top:8px;right:8px;background:rgba(28,20,10,.55);color:var(--gold);font-size:9.5px;font-weight:800;
  padding:3px 8px;border-radius:999px;letter-spacing:.05em;backdrop-filter:blur(4px);
}
.creator-mini{flex:none;width:98px;text-align:center;}
.creator-mini .cm-avatar{width:66px;height:66px;margin:0 auto 8px;}
.creator-mini .cm-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.creator-mini .cm-sub{font-size:10.5px;color:var(--grey-soft);}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 20px;}
.product-card{border-radius:var(--r-lg);overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-card);}
.product-card .pc-img{height:120px;position:relative;}
.product-card .pc-fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;}
.product-card .pc-body{padding:10px 12px 12px;}
.product-card .pc-name{font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.3;}
.product-card .pc-shop{font-size:10.5px;color:var(--grey-soft);margin-bottom:6px;}
.product-card .pc-price{font-size:14px;font-weight:800;color:var(--gold-dark);}
.hashtag-pill{flex:none;padding:10px 16px;border-radius:14px;background:var(--ink);color:#fff;}
.hashtag-pill .ht-name{font-size:13px;font-weight:700;}
.hashtag-pill .ht-count{font-size:10.5px;color:rgba(255,255,255,.6);}

/* ============ SHOP DETAIL ============ */
.shop-hero{height:150px;position:relative;flex:none;}
.shop-hero .sh-back{position:absolute;top:16px;left:16px;}
.shop-hero .sh-actions{position:absolute;top:16px;right:16px;display:flex;gap:8px;}
.shop-identity{padding:0 18px;margin-top:-34px;position:relative;z-index:2;}
.shop-identity .si-logo{width:64px;height:64px;border-radius:18px;background:#fff;border:3px solid #fff;box-shadow:var(--sh-soft);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px;}
.shop-identity .si-name{font-size:19px;margin-top:10px;display:flex;align-items:center;gap:6px;}
.shop-identity .si-cat{font-size:12.5px;color:var(--grey-soft);margin-top:2px;}
.shop-identity .si-desc{font-size:13px;color:var(--grey);margin-top:8px;line-height:1.5;}
.shop-stats-row{display:flex;gap:22px;padding:16px 18px;}
.shop-stats-row .ssr-item{text-align:left;}
.shop-stats-row .ssr-num{font-size:16px;}
.shop-stats-row .ssr-label{font-size:11px;color:var(--grey-soft);}
.shop-cta-row{display:flex;gap:10px;padding:4px 18px 16px;}
.shop-cta-row .btn{flex:1;}
.shop-cats{display:flex;gap:8px;padding:0 18px 14px;overflow-x:auto;}

/* ============ CREATE / CREATOR HUB ============ */
.creator-hero{
  margin:0 18px 18px;padding:22px;border-radius:var(--r-xl);
  background:linear-gradient(150deg,#1c1c1c,#3a332a 60%,var(--gold-dark));color:#fff;position:relative;overflow:hidden;
}
.creator-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(232,119,13,.28);}
.creator-hero h3{color:#fff;font-size:18px;margin-bottom:6px;}
.creator-hero p{font-size:12.5px;color:rgba(255,255,255,.75);max-width:80%;margin-bottom:16px;}
.wizard-steps{display:flex;flex-direction:column;gap:10px;padding:0 18px 18px;}
.wizard-step{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;}
.wizard-step .ws-num{width:30px;height:30px;border-radius:50%;background:var(--beige-light);color:var(--gold-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
.wizard-step.done .ws-num{background:var(--gold);color:#fff;}
.wizard-step .ws-title{font-size:13.5px;font-weight:700;}
.wizard-step .ws-sub{font-size:11.5px;color:var(--grey-soft);}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 18px 16px;}
.stat-tile{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;}
.stat-tile .st-icon{width:34px;height:34px;border-radius:10px;background:var(--beige-light);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--gold-dark);}
.stat-tile .st-val{font-size:19px;}
.stat-tile .st-label{font-size:11px;color:var(--grey-soft);}
.badge-row{display:flex;gap:10px;padding:0 18px 18px;overflow-x:auto;}
.badge-chip{flex:none;width:76px;text-align:center;}
.badge-chip .bc-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(150deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;margin:0 auto 6px;}
.badge-chip.locked .bc-icon{background:var(--beige-light);color:var(--line);}
.badge-chip .bc-label{font-size:10.5px;font-weight:700;}
.affiliate-box{margin:0 18px 18px;padding:16px;border-radius:var(--r-lg);background:var(--beige-light);}
.affiliate-box .ab-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:11px 13px;margin-top:10px;font-size:12.5px;color:var(--grey);border:1px solid var(--line);}
.affiliate-box .ab-row b{color:var(--ink);word-break:break-all;}
#qr-canvas-wrap{display:flex;justify-content:center;margin-top:14px;}
#qr-canvas-wrap canvas,#qr-canvas-wrap img{border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line);}

/* ============ PUBLIER / CREATE OPTIONS SHEET ============ */
.create-opt-grid{display:flex;flex-direction:column;gap:10px;}
.create-opt{
  display:flex;align-items:center;gap:14px;width:100%;padding:13px;
  background:var(--beige-light);border:1.5px solid transparent;border-radius:var(--r-lg);
  text-align:left;animation:koraa-fade-up .32s cubic-bezier(.2,.7,.3,1) backwards;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
.create-opt:nth-child(1){animation-delay:.02s;}
.create-opt:nth-child(2){animation-delay:.07s;}
.create-opt:nth-child(3){animation-delay:.12s;}
.create-opt:active{transform:scale(.97);background:#fff;border-color:var(--line);}
.create-opt .co-icon{
  width:48px;height:48px;border-radius:14px;flex:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 18px -10px rgba(28,20,10,.45);
}
.create-opt .co-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.create-opt .co-text b{font-size:14px;font-weight:700;color:var(--ink);}
.create-opt .co-text span{font-size:12px;color:var(--grey-soft);line-height:1.35;}
.create-opt .co-chev{flex:none;color:var(--grey-soft);transition:transform .15s ease;}
.create-opt:active .co-chev{transform:translateX(2px);}

/* ============ MESSAGES ============ */
.conv-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);}
.conv-row .cv-avatar{width:50px;height:50px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:800;color:#fff;font-size:17px;}
.conv-row .cv-body{flex:1;min-width:0;}
.conv-row .cv-top{display:flex;justify-content:space-between;gap:8px;}
.conv-row .cv-name{font-size:14px;font-weight:700;}
.conv-row .cv-time{font-size:11px;color:var(--grey-soft);}
.conv-row .cv-preview{font-size:12.5px;color:var(--grey-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.conv-row .cv-unread{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none;}
.chat-scroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.msg-bubble{max-width:76%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.4;}
.msg-bubble.mine{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px;}
.msg-bubble.theirs{align-self:flex-start;background:var(--beige-light);color:var(--ink);border-bottom-left-radius:5px;}
.chat-inputbar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px calc(10px + var(--safe-bottom));border-top:1px solid var(--line);background:#fff;}
.chat-inputbar input{flex:1;padding:11px 16px;border-radius:999px;background:var(--beige-light);border:1px solid var(--line);font-size:13.5px;}
.chat-inputbar .send-btn{width:42px;height:42px;border-radius:50%;background:var(--gold-dark);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}

/* ============ PROFILE ============ */
.profile-hero{padding:8px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.profile-hero .ph-name{font-size:19px;margin-top:12px;}
.profile-hero .ph-handle{font-size:12.5px;color:var(--grey-soft);}
.profile-hero .ph-level{display:flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold-dark);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;margin-top:8px;}
.profile-followrow{display:flex;gap:26px;margin-top:14px;}
.profile-followrow .pf-item .pf-num{font-size:15px;}
.profile-followrow .pf-item .pf-label{font-size:11px;color:var(--grey-soft);}
.profile-tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.profile-tabs::-webkit-scrollbar{display:none;}
.profile-tab{flex:none;white-space:nowrap;text-align:center;padding:12px 12px;font-size:12.5px;font-weight:700;color:var(--grey-soft);border-bottom:2.5px solid transparent;}
.profile-tab.active{color:var(--ink);border-color:var(--gold);}
.dash-list{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.dash-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;}
.dash-row .dr-icon{width:36px;height:36px;border-radius:10px;background:var(--beige-light);color:var(--gold-dark);display:flex;align-items:center;justify-content:center;flex:none;}
.dash-row .dr-label{font-size:13px;color:var(--grey);flex:1;}
.dash-row .dr-val{font-size:14.5px;}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.history-row .hr-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--beige-light);color:var(--grey-soft);}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px;}
.content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px 20px;}
.content-tile{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;animation:koraa-fade-up .32s cubic-bezier(.2,.7,.3,1) backwards;transition:transform .15s ease;}
.content-tile:active{transform:scale(.96);}
.content-tile .ct-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);}
.content-tile .ct-play{position:absolute;top:8px;right:8px;color:#fff;opacity:.9;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.content-tile .ct-stats{position:absolute;left:8px;bottom:7px;display:flex;align-items:center;gap:4px;color:#fff;font-size:11px;font-weight:700;}

/* ============ NOTIFICATIONS / SPONSOR ============ */
.notif-row{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);}
.notif-row .nr-icon{width:38px;height:38px;border-radius:50%;background:var(--beige-light);color:var(--gold-dark);display:flex;align-items:center;justify-content:center;flex:none;}
.notif-row.unread{background:var(--gold-soft);}
.notif-row .nr-text{font-size:13px;line-height:1.4;}
.notif-row .nr-time{font-size:11px;color:var(--grey-soft);margin-top:2px;}
.sponsor-mode-toggle{display:flex;background:var(--beige-light);border-radius:999px;padding:4px;margin:0 18px 16px;}
.sponsor-mode-toggle button{flex:1;padding:10px 0;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--grey-soft);}
.sponsor-mode-toggle button.active{background:var(--ink);color:#fff;}
.campaign-card{margin:0 18px 12px;padding:16px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);}
.campaign-card .cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.campaign-card .cc-title{font-size:14.5px;font-weight:700;}
.campaign-card .cc-status{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;}
.campaign-card .cc-status.open{background:rgba(63,125,92,.14);color:var(--success);}
.campaign-card .cc-status.review{background:var(--gold-soft);color:var(--gold-dark);}
.campaign-card .cc-desc{font-size:12.5px;color:var(--grey-soft);line-height:1.5;margin-bottom:10px;}
.campaign-card .cc-meta{display:flex;gap:16px;font-size:11.5px;color:var(--grey-soft);}

/* ============ MODALS / SHEETS / TOAST ============ */
.sheet-backdrop{position:absolute;inset:0;background:rgba(20,16,12,.5);z-index:100;display:flex;align-items:flex-end;}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;max-height:82%;display:flex;flex-direction:column;animation:sheetUp .22s ease;}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--line);border-radius:99px;margin:10px auto 4px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 14px;border-bottom:1px solid var(--line);}
.sheet-head h4{font-size:16px;}
.sheet-body{flex:1;overflow-y:auto;padding:16px 18px;}
.sheet-foot{padding:14px 18px calc(14px + var(--safe-bottom));border-top:1px solid var(--line);}
.comment-item{display:flex;gap:10px;margin-bottom:16px;}
.comment-item .ci-avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;}
.comment-item .ci-name{font-size:12.5px;font-weight:700;}
.comment-item .ci-text{font-size:13px;color:var(--grey);margin-top:2px;}
.comment-item .ci-time{font-size:10.5px;color:var(--grey-soft);margin-top:4px;}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.share-opt{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--grey);}
.share-opt .so-icon{width:52px;height:52px;border-radius:16px;background:var(--beige-light);display:flex;align-items:center;justify-content:center;color:var(--gold-dark);}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.gift-opt{border:1.5px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;}
.gift-opt.selected{border-color:var(--gold);background:var(--gold-soft);}
.gift-opt .go-icon{font-size:24px;margin-bottom:6px;}
.gift-opt .go-price{font-size:11.5px;color:var(--grey-soft);font-weight:700;}
.toast{
  pointer-events:auto;background:rgba(28,20,10,.92);color:#fff;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;box-shadow:var(--sh-soft);animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.qty-badge{background:var(--gold);color:#fff;border-radius:999px;font-size:9.5px;font-weight:800;padding:2px 6px;}
.empty-state{padding:60px 30px;text-align:center;color:var(--grey-soft);}
.empty-state .es-icon{font-size:38px;margin-bottom:12px;}
</style>

  <div id="phone-frame">

    <!-- ================= AUTH / ONBOARDING ================= -->

    </div>

  </div>

<script id="koraa-app">
/* =====================================================================
   KORAA — Application front-end (prototype connecté à Orbit City / Orbit Back Office)
   Stockage : localStorage — clé "koraa_db_v1"
   ===================================================================== */
"use strict";

/* =====================================================================
   API KORAA — connexion au vrai backend Python (FastAPI).
   Remplace les données de démonstration : inscriptions, connexions,
   achats et abonnés sont désormais réels et stockés côté serveur.
   ===================================================================== */
const API_BASE = window.KORAA_API_BASE || '';
const TOKEN_KEY = 'koraa_token_v1';

function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(tok){ if(tok) localStorage.setItem(TOKEN_KEY, tok); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

async function apiFetch(path, options={}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer '+token;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, options, {headers}));
  }catch(e){
    throw new Error("Impossible de joindre le serveur KORAA. Vérifie ta connexion.");
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* pas de corps JSON (ex: 204) */ }
  if(!res.ok){
    let msg = `Erreur serveur (${res.status})`;
    if(data && data.detail){ msg = typeof data.detail==='string' ? data.detail : JSON.stringify(data.detail); }
    const err = new Error(msg);
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

const API = {
  signup: (payload)=>apiFetch('/auth/signup', {method:'POST', body:JSON.stringify(payload)}),
  resendOtp: (phone)=>apiFetch('/auth/resend-otp', {method:'POST', body:JSON.stringify({phone})}),
  verifyPhone: (phone, code)=>apiFetch('/auth/verify-phone', {method:'POST', body:JSON.stringify({phone, code})}),
  login: (identifier, password)=>apiFetch('/auth/login', {method:'POST', body:JSON.stringify({identifier, password})}),
  me: ()=>apiFetch('/auth/me'),
  listShops: ()=>apiFetch('/shops'),
  listProducts: (shopId)=>apiFetch(`/shops/${shopId}/products`),
  createOrder: (payload)=>apiFetch('/orders', {method:'POST', body:JSON.stringify(payload)}),
  myOrders: ()=>apiFetch('/orders/me'),
  followCreator: (id)=>apiFetch(`/creators/${id}/follow`, {method:'POST'}),
  unfollowCreator: (id)=>apiFetch(`/creators/${id}/unfollow`, {method:'POST'}),
  creatorProgress: ()=>apiFetch('/creators/me/progress'),
  addPartnerShopApi: (shopId)=>apiFetch(`/creators/me/partner-shops/${shopId}`, {method:'POST'}),
  createPost: (payload)=>apiFetch('/posts', {method:'POST', body:JSON.stringify(payload)}),
  feed: ()=>apiFetch('/posts/feed'),
  publicUser: (id)=>apiFetch(`/users/${id}/public`),
};

/* ---------------------------------------------------------------------
   ICONES (SVG inline — aucune dépendance CDN, cf. approche Orbit)

// Échappement HTML systématique pour tout texte saisi par un utilisateur
// (commentaire, message de chat, nom affiché...) avant insertion dans du
// innerHTML — protège contre les injections de code (XSS).
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function fmtFCFA(n){ return Math.round(n).toLocaleString('fr-FR').replace(/\u202f/g,' ') + ' F'; }
function fmtCompact(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'k';
  return String(n);
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function timeAgo(ts){
  const s = Math.max(1, Math.floor((Date.now()-ts)/1000));
  if(s<60) return 'à l’instant';
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  return Math.floor(s/86400)+' j';
}
const GRADIENTS = [
  'linear-gradient(150deg,#3a2e1f,#8a6a35)','linear-gradient(150deg,#2c3b2e,#5f8a63)',
  'linear-gradient(150deg,#3a2222,#8a4a3d)','linear-gradient(150deg,#22303a,#3d6a8a)',
  'linear-gradient(150deg,#332440,#6a4a8a)','linear-gradient(150deg,#403322,#8a6f3d)',
  'linear-gradient(150deg,#1f3a37,#3d8a7a)','linear-gradient(150deg,#3a2a3a,#8a3d78)'
];
function gradFor(seed){ let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0; return GRADIENTS[h%GRADIENTS.length]; }

const SEED_SHOPS = [];

const CREATOR_FIRSTNAMES = ['Aïcha','Kouassi','Mariam','Yao','Fatou','Serge','Aminata','David','Grace','Ibrahim','Nadège','Franck'];
const CREATOR_LASTNAMES = ['Koné','N’Guessan','Traoré','Diabaté','Bamba','Kouadio','Ouattara','Yao','Cissé','Bah'];
function buildCreators(n){
  const list=[];
  for(let i=0;i<n;i++){
    const name = CREATOR_FIRSTNAMES[i%CREATOR_FIRSTNAMES.length]+' '+CREATOR_LASTNAMES[(i*3)%CREATOR_LASTNAMES.length];
    const followers = 800 + Math.floor(Math.random()*42000);
    const level = followers>30000?'Icône':followers>15000?'Étoile':followers>5000?'Influenceur':followers>1500?'Ambassadeur':'Débutant';
    list.push({
      id: uid('cr'), name, handle:'@'+name.toLowerCase().replace(/[’' ]/g,''),
      followers, level, color: gradFor(name),
      videos: 4+Math.floor(Math.random()*40),
      sales: Math.floor(Math.random()*90),
      revenue: Math.floor(Math.random()*450000),
    });
  }
  return list.sort((a,b)=>b.followers-a.followers);
}
const SEED_CREATORS = buildCreators(0); // aucun compte créateur fictif au démarrage

const POST_TEMPLATES = [
  d=>`Je viens de tester ${d.p.name} chez ${d.s.name} 😍 verdict dans la vidéo !`,
  d=>`Mon avis honnête sur ${d.p.name} — vous allez adorer.`,
  d=>`${d.s.name} m'a envoyé ce produit, voici ce que j'en pense vraiment.`,
  d=>`On a testé pour vous : ${d.p.name}. Lien direct dans la boutique !`,
  d=>`Coup de cœur du mois chez ${d.s.name} 🔥 ${d.p.name}`,
];
function buildPosts(){
  const posts=[];
  SEED_SHOPS.forEach(s=>{
    s.products.forEach((p,idx)=>{
      const creator = SEED_CREATORS[Math.floor(Math.random()*SEED_CREATORS.length)];
      const tmpl = POST_TEMPLATES[Math.floor(Math.random()*POST_TEMPLATES.length)];
      posts.push({
        id: uid('post'), shopId:s.id, productName:p.name, productPrice:p.price, productOld:p.oldPrice||null,
        creatorId:creator.id, creatorName:creator.name, creatorLevel:creator.level,
        desc: tmpl({p,s}), hashtags:['#'+s.name.replace(/\s/g,''),'#KORAA','#'+p.cat.replace(/\s/g,'')],
        music: s.name+' • Son original', grad: gradFor(p.name+idx),

        gifts: Math.floor(Math.random()*60), liked:false, saved:false,

  // mélange
  for(let i=posts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [posts[i],posts[j]]=[posts[j],posts[i]]; }
  return posts;
}

const DB_KEY = 'koraa_db_v1';
let DB = null;

function freshDB(){
  const posts = buildPosts();
  posts.forEach(p=>{
    const n = 1+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){
      const c = SEED_CREATORS[Math.floor(Math.random()*SEED_CREATORS.length)];
      p.comments.push({id:uid('cm'), author:c.name, color:c.color, text:SAMPLE_COMMENTS[Math.floor(Math.random()*SAMPLE_COMMENTS.length)], ts:Date.now()-Math.floor(Math.random()*5e6)});
    }
  });
  const sponsorCampaigns = []; // plus de campagnes fictives liées à de fausses boutiques
  return {
    version:1,
    shops: JSON.parse(JSON.stringify(SEED_SHOPS)),
    creators: SEED_CREATORS,
    posts,
    sponsorCampaigns,
    orders: [], // commandes de toute la plateforme (toutes boutiques, tous acheteurs) — alimente aussi le Back Office ORBIT
    usersById: {},  // comptes réels créés via inscription, conservés même après déconnexion
    credentials: [], // identifiants de connexion : {userId, email, phone, passHash}
    user: null, // utilisateur actuellement connecté (session courante), défini à l'inscription/connexion
  };
}

// Anciens identifiants de boutiques/comptes de démonstration à purger des sauvegardes existantes
const LEGACY_FAKE_SHOP_IDS = ['shop_goldchicken','shop_superlife','shop_ivoiredelices','shop_fendix','shop_abidjanmode','shop_technova'];

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) DB = JSON.parse(raw);
    else DB = freshDB();
  }catch(e){
    // Donnée illisible (corruption, changement de format) : on la met de côté
    // au lieu de l'écraser silencieusement, pour une éventuelle récupération,
    // puis on repart sur une base saine plutôt que de bloquer l'application.
    console.error('KORAA : données locales corrompues, réinitialisation sécurisée.', e);
    try{ const raw = localStorage.getItem(DB_KEY); if(raw) localStorage.setItem(DB_KEY+'_corrompue_'+Date.now(), raw); }catch(e2){ /* quota plein, on ignore */ }
    DB = freshDB();
  }
  if(!DB.sponsorCampaigns) DB.sponsorCampaigns = freshDB().sponsorCampaigns;
  if(!Array.isArray(DB.orders)) DB.orders = [];
  // Migration douce : anciennes sauvegardes (mode "connexion démo") sans registre de comptes.
  if(!DB.usersById) DB.usersById = {};
  if(!Array.isArray(DB.credentials)) DB.credentials = [];
  Object.values(DB.usersById).forEach(u=>{ if(!Array.isArray(u.partners)) u.partners = []; });
  if(DB.user && !DB.usersById[DB.user.id]){
    DB.usersById[DB.user.id] = DB.user;
  }
  // Nettoyage définitif des boutiques/comptes fictifs (Gold Chicken, Superlife, etc.)
  // encore présents dans une sauvegarde locale créée avant cette mise à jour.
  if(!DB.demoDataCleared){
    DB.shops = (DB.shops||[]).filter(s=>!LEGACY_FAKE_SHOP_IDS.includes(s.id));
    DB.creators = []; // les comptes créateurs générés automatiquement ne sont pas de vrais comptes
    DB.posts = (DB.posts||[]).filter(p=>!LEGACY_FAKE_SHOP_IDS.includes(p.shopId));
    DB.sponsorCampaigns = (DB.sponsorCampaigns||[]).filter(c=>!LEGACY_FAKE_SHOP_IDS.includes(c.shopId));
    Object.values(DB.usersById).forEach(u=>{
      if(u.conversations) u.conversations = u.conversations.filter(c=>!LEGACY_FAKE_SHOP_IDS.includes(c.withId));
      if(u.following){
        u.following.shops = (u.following.shops||[]).filter(id=>!LEGACY_FAKE_SHOP_IDS.includes(id));
      }
      if(u.favorites){
        u.favorites.shops = (u.favorites.shops||[]).filter(id=>!LEGACY_FAKE_SHOP_IDS.includes(id));
      }
    });
    DB.demoDataCleared = true;
    saveDB();
  }
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ /* quota etc. */ } syncToOrbitBackoffice(); }

/* ---------------------------------------------------------------------
   PONT DE SYNCHRONISATION — KORAA -> ORBIT BACK OFFICE
   ----------------------------------------------------------------------
   KORAA et ORBIT sont deux prototypes distincts, mais tous deux simulent
   leur "base de données" via localStorage. Pour donner à voir une vraie
   boucle produit de bout en bout, KORAA écrit ici un résumé de ses
   créateurs, campagnes sponsorisées et commandes dans la MÊME clé
   localStorage que le site et le back-office ORBIT ("orbit_prototype_db"),
   à condition que les 3 fichiers soient servis sur la même origine
   (même domaine, ou ouverts depuis le même dossier via un petit serveur
   local — l'isolement par onglet en file:// empêche ce partage).
   Le back-office lit ensuite ce pont dans ses modules "Créateurs" et
   "Sponsoring", et fusionne les commandes KORAA dans sa vue consolidée
   "Commandes & clients finaux", sans qu'aucune donnée d'entreprise ORBIT
   réelle (abonnements, facturation) ne soit jamais modifiée par KORAA.
--------------------------------------------------------------------- */
const ORBIT_SHARED_KEY = 'orbit_prototype_db';
function syncToOrbitBackoffice(){
  try{
    const raw = localStorage.getItem(ORBIT_SHARED_KEY);
    const shared = raw ? JSON.parse(raw) : {};
    ['companies','activities','users','userActivities','clients','sales','expenses','suppliers','products','orders','deliveries','aiChats'].forEach(k=>{
      if(!Array.isArray(shared[k])) shared[k] = [];
    });

    // Comptes réels KORAA (inscriptions) : toute création de compte doit apparaître côté ORBIT.
    const koraaAccounts = Object.values(DB.usersById||{}).map(acc=>({
      id:acc.id, name:acc.name, email:acc.email||'', phone:acc.phone||'', ville:acc.ville||'',
      isCreator:!!acc.isCreator, level:acc.level, followers:acc.stats?.followers||0,
      orders:acc.stats?.orders||0, spent:acc.stats?.spent||0, revenue:acc.stats?.revenue||0,
      rewardsPoints:acc.stats?.rewardsPoints||0, vouchers:acc.vouchers||[],
      joinedAt:acc.joinedAt, source:'koraa',
    }));

    // Historique complet des échanges (chat client ↔ boutique) pour le suivi ORBIT.
    const koraaChats = [];
    Object.values(DB.usersById||{}).forEach(acc=>{
      (acc.conversations||[]).forEach(conv=>{
        (conv.messages||[]).forEach(m=>{
          koraaChats.push({
            id:m.id, convId:conv.id, shopId:conv.withId, shopName:conv.withName,
            userId:acc.id, userName:acc.name, fromUser:!!m.mine, fromAI:!!m.fromAI,
            text:m.text, ts:m.ts, source:'koraa',
          });
        });
      });
    });

    // Dépenses (achats) de chaque utilisateur KORAA, pour le suivi financier consolidé ORBIT.
    const koraaUserSpending = (DB.orders||[]).map(o=>({
      id:o.id, userId:o.buyerId, userName:o.buyerName, shopId:o.shopId, shopName:o.shopName,
      productName:o.productName, amount:o.price, payment:o.payment, createdAt:o.createdAt, source:'koraa',
    }));

    // Créateurs & campagnes sponsoring, pour les modules Back Office dédiés
    shared.koraaBridge = {
      updatedAt: Date.now(),
      shops: DB.shops.map(s=>({ id:s.id, name:s.name, cat:s.cat, followers:s.followers, rating:s.rating, productsCount:s.products.length })),
      creators: DB.creators.map(c=>({ id:c.id, name:c.name, followers:c.followers||0, sales:c.sales||0, revenue:c.revenue||0 })),
      sponsorCampaigns: (DB.sponsorCampaigns||[]).map(c=>{
        const shop = DB.shops.find(s=>s.id===c.shopId);
        return { id:c.id, title:c.title, desc:c.desc, status:c.status, budget:c.budget, slots:c.slots, applied:c.applied, shopName: shop ? shop.name : '—' };
      }),
      accounts: koraaAccounts,
      chats: koraaChats,
      userSpending: koraaUserSpending,
    };

    // Commandes KORAA fusionnées dans la table "orders" partagée avec ORBIT.
    // On les marque source:'koraa' et on embarque directement les infos
    // d'affichage (boutique, acheteur) : la vue back-office s'en sert en
    // repli quand aucune fiche entreprise/client ORBIT ne correspond,
    // ce qui évite de créer de fausses "entreprises clientes" ORBIT.
    const others = shared.orders.filter(o=>o.source!=='koraa');
    const koraaOrders = (DB.orders||[]).map(o=>{
      const liveStage = o.cancelled ? o.stage : koraaOrderStage(o);
      return {
        id:o.id, source:'koraa',
        shopName:o.shopName, productName:o.productName, buyerName:o.buyerName, buyerPhone:o.buyerPhone,
        creatorName:o.creatorName, commission:o.commission,
        total:o.price, qty:1, status:o.status, stage:liveStage,
        returned:!!o.returned, cancelled:!!o.cancelled, createdAt:o.createdAt,
      };
    });
    shared.orders = others.concat(koraaOrders);

    localStorage.setItem(ORBIT_SHARED_KEY, JSON.stringify(shared));
  }catch(e){ /* stockage indisponible, quota, ou origine différente : on ignore silencieusement */ }
}

/* ---------- Validation & comptes (mode lancement — plus de connexion démo) ----------
   Règles alignées avec ORBIT pour une expérience cohérente entre les 3 apps. */
function isValidEmail(value){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((value||'').trim()); }
function isValidPhoneKoraa(value){ return /^[0-9+\s().-]{7,20}$/.test((value||'').trim()); }
function normId(value){ return (value||'').trim().toLowerCase().replace(/[\s().-]/g,''); }
// Hash simple côté client — suffisant pour ce prototype localStorage, mais
// ne remplace pas une vraie authentification serveur (à mettre en place avant tout lancement réel).
// ---------------------------------------------------------------------------
// Sécurité — hachage des mots de passe (SHA-256 salé, Web Crypto) avec un sel
// aléatoire propre à chaque compte, en remplacement de l'ancien hachage non
// cryptographique à sel fixe partagé (vulnérable aux tables arc-en-ciel).
// Les identifiants créés avant ce correctif (`passHash` sans `passSalt`) sont
// migrés automatiquement vers le nouveau format dès la prochaine connexion
// réussie.
// ---------------------------------------------------------------------------
function genSalt(){
  return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPass(pwd, salt){
  const data = new TextEncoder().encode(salt + ':' + pwd);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
// Ancien hachage (DJB2, sel fixe) conservé uniquement pour vérifier — puis
// migrer — les comptes créés avant ce correctif.
function legacyHashPass(pwd){
  let h = 5381;
  const s = 'koraa_salt_'+pwd;
  for(let i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
async function verifyCredential(cred, pwd){
  if(cred.passSalt) return (await hashPass(pwd, cred.passSalt)) === cred.passHash;
  return cred.passHash === legacyHashPass(pwd);
}
async function setCredentialPassword(cred, pwd){
  cred.passSalt = genSalt();
  cred.passHash = await hashPass(pwd, cred.passSalt);
}

/* ---------------------------------------------------------------------
   PONT AUTH RÉEL (backend KORAA / FastAPI)
   ----------------------------------------------------------------------
   Le backend attend un numéro au format international (+225...). Ces
   utilitaires convertissent les numéros locaux saisis par l'utilisateur
   et fusionnent la fiche riche stockée localement (stats, badges, fil
   d'actualité...) avec le compte réel renvoyé par l'API (id, compteurs
   d'achats/abonnés, statut créateur), qui reste la source de vérité pour
   ces derniers champs.
--------------------------------------------------------------------- */
function normalizePhoneCI(value){
  let v = (value||'').trim().replace(/[\s().-]/g,'');
  if(v.startsWith('+')) return v;
  if(v.startsWith('00')) return '+'+v.slice(2);
  if(v.startsWith('0')) v = v.slice(1);
  return '+225'+v;
}

async function hydrateSessionFromApi(serverUser){
  const localId = 'api_'+serverUser.id;
  let profile = DB.usersById[localId];
  if(!profile){
    profile = defaultUser({ name: serverUser.name, email: serverUser.email, phone: serverUser.phone, ville:'Abidjan' });
    profile.id = localId;
  }
  profile.apiId = serverUser.id;
  profile.name = serverUser.name;
  profile.email = serverUser.email;
  profile.phone = serverUser.phone;
  profile.phoneVerified = !!serverUser.phone_verified;
  profile.isCreator = !!serverUser.is_creator;
  profile.stats = profile.stats || {};
  profile.stats.orders = serverUser.purchases_count;
  profile.stats.followers = serverUser.followers_count;
  DB.usersById[localId] = profile;
  DB.user = profile;
  persistAndSave();
  return profile;
}

/* ---------------------------------------------------------------------
   BOUTIQUES / PRODUITS RÉELS (backend KORAA)
   ----------------------------------------------------------------------
   Le catalogue n'est plus simulé (SEED_SHOPS est vide) : les boutiques et
   produits réels sont chargés depuis l'API et adaptés à la forme attendue
   par l'UI (cartes boutique/produit). `apiId` (identifiant numérique
   serveur) est conservé sur chaque boutique/produit — c'est lui qui est
   envoyé à `POST /orders`, jamais l'id local préfixé utilisé par l'UI.
--------------------------------------------------------------------- */
function mapApiProduct(p, shop){
  return {
    id: 'api_prod_'+p.id, apiId: p.id, shopId: shop.id, shopName: shop.name, shopColor: shop.color,
    name: p.name, price: p.price, oldPrice: null, cat: shop.cat, img: p.image_url || null,
  };
}
function mapApiShop(s){
  return {
    id: 'api_shop_'+s.id, apiId: s.id, name: s.name, cat: 'Boutique partenaire',
    description: s.description || '', color: gradFor(s.name), rating: 4.8, followers: 0, products: [],
  };
}
async function loadShopsFromApi(){
  try{
    const shops = await API.listShops();
    const mapped = [];
    for(const s of shops){
      const local = mapApiShop(s);
      try{
        const products = await API.listProducts(s.id);
        local.products = products.map(p=>mapApiProduct(p, local));
      }catch(e){ /* boutique sans produits accessibles pour l'instant */ }
      mapped.push(local);
    }
    DB.shops = mapped;
    persistAndSave();
    if(S.view==='discover' && RENDERERS.discover) RENDERERS.discover();
  }catch(e){
    // API injoignable ou pas encore de boutique créée côté serveur : on garde la liste vide plutôt que de planter.
    console.error('KORAA : chargement des boutiques impossible.', e);
  }
}

// Anti-brute-force : verrouille l'identifiant 60s après 5 échecs consécutifs.
const LOGIN_MAX_ATTEMPTS = 5;
const LOGIN_LOCK_MS = 60 * 1000;
const loginAttempts = {};
function loginLockStatus(id){
  const a = loginAttempts[id];
  if(!a) return { locked:false };
  if(a.lockedUntil && a.lockedUntil > Date.now()) return { locked:true, secondsLeft: Math.ceil((a.lockedUntil - Date.now())/1000) };
  if(a.lockedUntil && a.lockedUntil <= Date.now()) delete loginAttempts[id];
  return { locked:false };
}
function registerLoginFailure(id){
  const a = loginAttempts[id] || { count:0, lockedUntil:0 };
  a.count += 1;
  if(a.count >= LOGIN_MAX_ATTEMPTS){ a.lockedUntil = Date.now() + LOGIN_LOCK_MS; a.count = 0; }
  loginAttempts[id] = a;
}
function registerLoginSuccess(id){ delete loginAttempts[id]; }
function findCredential(idVal){
  const n = normId(idVal);
  return (DB.credentials||[]).find(c => (c.email && normId(c.email)===n) || (c.phone && normId(c.phone)===n));
}
function setAuthError(msg){
  const box = document.getElementById('auth-error');
  if(!box) return;
  if(!msg){ box.style.display='none'; box.textContent=''; return; }
  box.textContent = msg;
  box.style.display = 'block';
}

function doLogin(){
  setAuthError(null);
  const idVal = document.getElementById('login-id').value.trim();
  const pass = document.getElementById('login-pass').value;
  if(!idVal || !pass){ setAuthError('Merci de renseigner ton email (ou téléphone) et ton mot de passe.'); return; }
  if(idVal.includes('@') ? !isValidEmail(idVal) : !isValidPhoneKoraa(idVal)){
    setAuthError('Identifiant invalide. Utilise un email ou un numéro de téléphone valide.'); return;
  }
  const lock = loginLockStatus(idVal);
  if(lock.locked){ setAuthError(`Trop de tentatives. Réessaie dans ${lock.secondsLeft}s.`); return; }
  const btn = document.getElementById('btn-login');
  btn.classList.add('is-loading');
  const identifier = idVal.includes('@') ? idVal : normalizePhoneCI(idVal);
  API.login(identifier, pass).then(async (res)=>{
    registerLoginSuccess(idVal);
    setToken(res.access_token);
    await hydrateSessionFromApi(res.user);
    toast('Connexion réussie','check');
    enterApp();
  }).catch(err=>{
    registerLoginFailure(idVal);
    if(err.status===403){
      // Compte existant mais numéro pas encore vérifié : on renvoie vers l'étape OTP.
      setAuthError('Numéro non vérifié. Entre le code reçu par SMS pour activer ton compte.');
      S.authMode='signup';
      S.signupStep=4;
      S.signupData = Object.assign({phoneNormalized: identifier, phone: idVal}, S.signupData||{});
      API.resendOtp(identifier).catch(()=>{});
      renderAuth();
    } else if(err.status===401){
      setAuthError('Identifiants incorrects. Vérifie ton email/téléphone et ton mot de passe.');
    } else {
      setAuthError(err.message || 'Connexion impossible. Réessaie.');
    }
  }).finally(()=>{ btn.classList.remove('is-loading'); });
}

  if(S.signupStep===4){
    const resendEl = document.getElementById('su-resend-otp');
    if(resendEl) resendEl.addEventListener('click', ()=>{
      API.resendOtp(d.phoneNormalized).then(()=>toast('Nouveau code envoyé par SMS','check')).catch(err=>setAuthError(err.message||'Impossible de renvoyer le code.'));
    });
  }
  if(S.signupStep>1 && S.signupStep<4) document.getElementById('su-back').addEventListener('click',()=>{ collectSignupStep(); setAuthError(null); S.signupStep--; renderSignupStep(el); });
  document.getElementById('su-next').addEventListener('click',()=>{
    collectSignupStep();
    setAuthError(null);
    if(S.signupStep===1){
      if(!d.lastname || !d.firstname){ setAuthError('Merci de renseigner ton nom et ton prénom.'); return; }
      if(!isValidEmail(d.email)){ setAuthError('Merci de saisir un email valide.'); return; }
      if(!isValidPhoneKoraa(d.phone)){ setAuthError('Merci de saisir un numéro de téléphone valide.'); return; }
      if(!d.pass || d.pass.length<8){ setAuthError('Le mot de passe doit contenir au moins 8 caractères.'); return; }
      if(d.pass!==d.pass2){ setAuthError('Les deux mots de passe ne correspondent pas.'); return; }
      S.signupStep++; renderSignupStep(el);
      return;
    }
    if(S.signupStep===2){ S.signupStep++; renderSignupStep(el); return; }
    if(S.signupStep===3){
      // Étape 3 -> création réelle du compte côté serveur (API.signup), puis passage
      // à l'étape 4 (vérification du numéro par code SMS) au lieu d'enregistrer
      // directement en localStorage.
      if(!d.consent){ setAuthError('Merci d’accepter la politique de confidentialité pour continuer.'); return; }
      const btn = document.getElementById('su-next');
      btn.classList.add('is-loading');
      const fullname = `${d.firstname||'Nouvel'} ${d.lastname||'Utilisateur'}`.trim();
      const phone = normalizePhoneCI(d.phone);
      d.phoneNormalized = phone;
      API.signup({ name: fullname, email: d.email, phone, password: d.pass })
        .then(()=>{
          toast('Compte créé — code envoyé par SMS','check');
          S.signupStep = 4;
          renderSignupStep(el);
        })
        .catch(err=>{
          if(err.status===409) setAuthError('Un compte KORAA existe déjà avec cet email ou ce téléphone. Connecte-toi plutôt.');
          else setAuthError(err.message || 'Inscription impossible. Réessaie.');
        })
        .finally(()=>btn.classList.remove('is-loading'));
      return;
    }
    // Étape 4 : vérification du code OTP reçu par SMS -> obtention du token et connexion.
    const code = (d.otp||'').trim();
    if(!/^[0-9]{6}$/.test(code)){ setAuthError('Merci de saisir le code à 6 chiffres reçu par SMS.'); return; }
    const btn = document.getElementById('su-next');
    btn.classList.add('is-loading');
    API.verifyPhone(d.phoneNormalized, code).then(async (res)=>{
      setToken(res.access_token);
      await hydrateSessionFromApi(res.user);
      // Complète la fiche locale (profil riche) avec les infos saisies pendant l'inscription.
      const u = DB.user;
      u.ville = d.ville || u.ville; u.commune = d.commune || u.commune;
      u.profession = d.profession || u.profession; u.interests = d.interests || u.interests;
      u.langue = d.langue || u.langue;
      persistAndSave();
      toast('Numéro vérifié — bienvenue sur KORAA 🎉','check');
      enterApp();
    }).catch(err=>{
      setAuthError(err.message || 'Code incorrect.');
    }).finally(()=>btn.classList.remove('is-loading'));
  });
}
function collectSignupStep(){
  const d = S.signupData;
  const g = id=>document.getElementById(id);
  if(S.signupStep===1){
    if(g('su-lastname')) d.lastname=g('su-lastname').value;
    if(g('su-firstname')) d.firstname=g('su-firstname').value;
    if(g('su-email')) d.email=g('su-email').value;
    if(g('su-phone')) d.phone=g('su-phone').value;
    if(g('su-pass')) d.pass=g('su-pass').value;
    if(g('su-pass2')) d.pass2=g('su-pass2').value;
    if(g('su-dob')) d.dob=g('su-dob').value;
    if(g('su-sexe')) d.sexe=g('su-sexe').value;
  } else if(S.signupStep===2){
    if(g('su-profession')) d.profession=g('su-profession').value;
    if(g('su-ville')) d.ville=g('su-ville').value;
    if(g('su-commune')) d.commune=g('su-commune').value;
    if(g('su-adresse')) d.adresse=g('su-adresse').value;
    if(g('su-langue')) d.langue=g('su-langue').value;
  } else if(S.signupStep===3){
    if(g('su-consent')) d.consent=g('su-consent').checked;
  } else if(S.signupStep===4){
    if(g('su-otp')) d.otp=g('su-otp').value;
  }
}

function wireFeedCardEvents(root){
  root.querySelectorAll('.feed-card[data-postid]').forEach(card=>{
    const postId = card.dataset.postid;
    const post = DB.posts.find(x=>x.id===postId);
    card.querySelector('[data-act="like"]').addEventListener('click', (e)=>{
      post.liked = !post.liked;
      post.likes += post.liked?1:-1;
      persistAndSave();
      renderFeedCardInPlace(card, post);
    });
    card.querySelector('[data-act="follow"]').addEventListener('click', ()=>{
      toggleFollowCreator(post.creatorId, post.creatorName);
      renderFeedCardInPlace(card, post);
    });
    card.querySelector('[data-act="comment"]').addEventListener('click', ()=> openCommentsSheet(post));
    card.querySelector('[data-act="share"]').addEventListener('click', ()=> openShareSheet(post));
    card.querySelector('[data-act="gift"]').addEventListener('click', ()=> openGiftSheet(post));
    card.querySelector('[data-act="buy"]').addEventListener('click', ()=> openBuySheet(post));
    card.querySelector('[data-act="shop"]').addEventListener('click', ()=> { S.activeShopId=post.shopId; goTo('shop'); });
  });
}
function renderFeedCardInPlace(card, post){
  const s = shopOf(post.shopId);
  const scrollTop = document.getElementById('feed-scroll').scrollTop;
  card.outerHTML = feedCardHTML(post);
  document.getElementById('feed-scroll').scrollTop = scrollTop;
  wireFeedCardEvents(document.getElementById('view-feed'));
}

function toggleFollowCreator(creatorId, creatorName){
  const u = user();

  if(i>-1){ u.following.creators.splice(i,1); toast('Tu ne suis plus '+creatorName); }
  else { u.following.creators.push(creatorId); u.stats.ranking += 2; toast('Tu suis maintenant '+creatorName,'check'); addNotification('users', `Nouveau follow : ${creatorName}`); }
  persistAndSave();
}
function toggleFollowShop(shopId){
  const u = user(); const s = shopOf(shopId);
  const i = u.following.shops.indexOf(shopId);
  if(i>-1){ u.following.shops.splice(i,1); u.stats.shopsFollowed=Math.max(0,u.stats.shopsFollowed-1); toast('Boutique retirée des suivis'); }

    </div>
    <div class="sheet-foot"><button class="btn btn-gold btn-block" id="confirm-buy">Payer ${fmtFCFA(post.productPrice)}</button></div>`, {maxHeight:'88%'});
  document.querySelectorAll('#buy-pay-methods [data-pay]').forEach(chip=>chip.addEventListener('click',()=>{
    document.querySelectorAll('#buy-pay-methods [data-pay]').forEach(x=>x.classList.remove('picked'));
    chip.classList.add('picked'); payMethod = chip.dataset.pay;
  }));
  document.getElementById('confirm-buy').addEventListener('click', ()=>{
    const buyName = document.getElementById('buy-name').value.trim() || u.name;
    const buyPhone = document.getElementById('buy-phone').value.trim() || u.phone || '';
    const buyAddress = document.getElementById('buy-address').value.trim();
    const payLabel = PAYMENT_METHODS.find(m=>m.id===payMethod)?.label || 'Wave';
    if(!s.apiId){
      toast("Cette boutique n'est pas encore synchronisée avec le serveur — achat impossible pour l'instant.");
      return;
    }
    const btn = document.getElementById('confirm-buy');
    btn.classList.add('is-loading');
    const cr = DB.creators.find(c=>c.id===post.creatorId);
    const referredByCreatorId = (cr && cr.apiId) ? cr.apiId : (post.creatorId===u.id && u.apiId ? u.apiId : null);
    // Source de vérité : la commande est créée côté serveur (POST /orders), qui fait
    // aussi avancer le vrai compteur purchases_count utilisé pour le déblocage créateur.
    API.createOrder({
      shop_id: s.apiId,
      product_id: post.productApiId || null,
      amount: post.productPrice,
      referred_by_creator_id: referredByCreatorId,
    }).then(async (order)=>{
      u.stats.orders++; u.stats.spent += post.productPrice;
      checkLoyaltyMilestones(u);
      u.orders.unshift({id:'srv_'+order.id, shopName:s.name, productName:post.productName, price:post.productPrice, ts:Date.now(), status:'Confirmée', payment:payLabel});
      u.history.unshift({label:`Achat — ${post.productName} (${s.name}) · ${payLabel}`, tag:'Commande', ts:Date.now()});
      // devient automatiquement partenaire de la boutique où l'achat vient d'être effectué
      addPartnerShopSilently(s.id);
      const commission = Math.round(post.productPrice*creatorCommissionRate((post.creatorId===u.id?u.stats.followers:cr?.followers)||0));
      if(cr){ cr.revenue += commission; cr.sales++; }
      if(post.creatorId===u.id){ u.stats.revenue += commission; u.stats.commissions += commission; u.stats.salesDone++; addNotification('wallet', `Nouvelle vente via ta vidéo « ${post.productName} » — commission ${fmtFCFA(commission)}`); }
      // Commande globale plateforme (affichage riche local + pont Back Office ORBIT) —
      // la commande réelle et le compteur d'achats vivent désormais côté serveur.
      if(!Array.isArray(DB.orders)) DB.orders = [];
      DB.orders.unshift({
        id:'srv_'+order.id, shopId:s.id, shopName:s.name, productName:post.productName, price:post.productPrice,
        buyerId:u.id, buyerName:buyName, buyerPhone:buyPhone, buyerAddress:buyAddress, payment:payLabel,
        creatorId:post.creatorId, creatorName:post.creatorName,
        commission, status:'attente', stage:'creee', returned:false, cancelled:false, createdAt:order.created_at,
      });
      persistAndSave();

/* ---------- Suivi de commande ---------- */
const ORDER_STAGE_LABELS_K = { creee:'Commande confirmée', payee:'Paiement reçu', livraison:'En livraison', livree:'Livrée' };
const ORDER_STAGE_ORDER_K = ['creee','payee','livraison','livree'];
// Fait évoluer visuellement la commande dans le temps (simulation de démo) :
// aucune vraie logistique derrière, mais donne une impression de suivi vivant.
function koraaOrderStage(o){
  if(o.cancelled) return 'annulee';
  const mins = (Date.now() - new Date(o.createdAt).getTime()) / 60000;
  if(mins < 2) return 'creee';
  if(mins < 10) return 'payee';
  if(mins < 45) return 'livraison';
  return 'livree';
}
function openOrdersSheet(){
  const u = user();
  const orders = u.orders || [];
  const bodyId = 'orders-sheet-body';
  openSheet(`
    <div class="sheet-head"><h4>Mes commandes</h4></div>
    <div class="sheet-body" id="${bodyId}" style="max-height:60vh;overflow-y:auto;">
      ${ordersSheetListHTML(orders, null)}
    </div>`);
  // Rafraîchit avec le statut réel renvoyé par le serveur (source de vérité),
  // tout en gardant l'affichage riche local (nom produit/boutique, moyen de paiement).
  API.myOrders().then(serverOrders=>{
    const byId = {}; serverOrders.forEach(o=> byId['srv_'+o.id]=o);
    const body = document.getElementById(bodyId);
    if(body) body.innerHTML = ordersSheetListHTML(orders, byId);
  }).catch(()=>{ /* hors-ligne ou serveur injoignable : on garde l'affichage local tel quel */ });
}
function ordersSheetListHTML(orders, serverById){
  if(!orders.length) return `<div class="empty-state">${ic('bag',28)}<p>Aucune commande pour le moment.</p></div>`;
  return orders.map(o=>{
    const serverOrder = serverById ? serverById[o.id] : null;
    const full = (DB.orders||[]).find(x=>x.id===o.id) || o;
    let label, pct;
    if(serverOrder){
      const STATUS_LABELS = { confirmed:'Confirmée', pending:'En attente', cancelled:'Annulée' };
      label = STATUS_LABELS[serverOrder.status] || serverOrder.status;
      pct = serverOrder.status==='cancelled' ? 0 : (serverOrder.status==='confirmed' ? Math.round(((ORDER_STAGE_ORDER_K.indexOf(koraaOrderStage(full))+1)/ORDER_STAGE_ORDER_K.length)*100) : 15);
    } else {
      const stage = koraaOrderStage(full);
      label = stage==='annulee' ? 'Annulée' : ORDER_STAGE_LABELS_K[stage];
      pct = stage==='annulee' ? 0 : Math.round(((ORDER_STAGE_ORDER_K.indexOf(stage)+1)/ORDER_STAGE_ORDER_K.length)*100);
    }
    return `<div class="dash-row" style="flex-direction:column;align-items:stretch;gap:6px;padding:12px 0;">
      <div style="display:flex;justify-content:space-between;"><b style="font-size:13.5px;">${o.productName}</b><span style="font-size:12px;color:var(--grey-soft);">${o.shopName}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--grey-soft);"><span>${fmtFCFA(o.price)}</span><span>${label}</span></div>
      <div style="height:6px;border-radius:99px;background:var(--beige-light);overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--gold);border-radius:99px;"></div></div>
    </div>`;
  }).join('');
}

    const scroll = document.getElementById('chat-scroll');
    scroll.innerHTML = conv.messages.map(m=>`<div class="msg-bubble ${m.mine?'mine':'theirs'}">${escapeHtml(m.text)}</div>`).join('');
    scroll.scrollTop = scroll.scrollHeight;
  }
  renderMsgs();
  const SHOP_REPLIES = ["Merci pour ton attente, c'est bien noté 👍","Oui bien sûr, c'est disponible 👍","Bonne question, laisse-moi vérifier avec l'équipe.","Nous livrons partout à Abidjan sous 24-48h."];
  document.getElementById('chat-send').addEventListener('click', sendChat);
  document.getElementById('chat-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendChat(); });
  function sendChat(){
    const input = document.getElementById('chat-input');
    const val = input.value.trim(); if(!val) return;
    conv.messages.push({id:uid('m'), mine:true, text:val, ts:Date.now()});
    conv.lastTs = Date.now();
    input.value='';
    persistAndSave(); renderMsgs();
    // 1) Réponse immédiate de l'assistant IA de la boutique, avec les liens utiles déjà en place.
    setTimeout(()=>{
      const slug = conv.withName.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
      const aiText = `🤖 Assistant ${conv.withName} — Merci pour ton message ! Un vendeur va te répondre très vite. En attendant :
• WhatsApp : wa.me/2250700000000
• Telegram : t.me/${slug}
• Paiement sécurisé : koraa.app/pay/${slug}`;
      conv.messages.push({id:uid('m'), mine:false, text:aiText, ts:Date.now(), fromAI:true});
      conv.lastTs = Date.now();
      persistAndSave(); renderMsgs();
      // Alerte envoyée vers Orbit Back Office : un client attend une vraie réponse du vendeur.
      notifyOrbitPendingMessage(conv, val);
      toast('Le vendeur a été alerté sur Orbit','check');
    }, 700+Math.random()*500);
    // 2) Un peu plus tard, simulate une vraie réponse humaine du vendeur (une fois alerté).
    setTimeout(()=>{
      conv.messages.push({id:uid('m'), mine:false, text:SHOP_REPLIES[Math.floor(Math.random()*SHOP_REPLIES.length)], ts:Date.now()});
      conv.lastTs = Date.now();
      persistAndSave();
      if(S.view==='chat' && S.activeConvId===conv.id) renderMsgs();
    }, 6000+Math.random()*4000);
  }
}
/* Alerte "message client en attente" transmise au Back Office ORBIT via le pont de synchronisation. */
function notifyOrbitPendingMessage(conv, lastMsgText){
  if(!Array.isArray(DB.pendingSellerAlerts)) DB.pendingSellerAlerts = [];
  DB.pendingSellerAlerts.unshift({
    id:uid('alert'), shopId:conv.withId, shopName:conv.withName,
    buyerId:user().id, buyerName:user().name, message:lastMsgText, ts:Date.now(), resolved:false,
  });
  persistAndSave();
}
