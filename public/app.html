/* ---------------------------------------------------------------------
   CRÉATEURS / FEED RÉELS (backend KORAA)
   ----------------------------------------------------------------------
   Le déblocage créateur (10 achats + 500 abonnés) et les promotions
   publiées sont désormais réels. Ces helpers chargent les profils publics
   de créateurs, la progression réelle de l'utilisateur, et le fil de
   promotions (`GET /posts/feed`) — remplaçant les créateurs/posts simulés
   (`SEED_CREATORS`/`buildPosts`, tous deux vides depuis le nettoyage des
   fausses données).
--------------------------------------------------------------------- */
function ensureCreatorLocal(pub){
  let c = DB.creators.find(x=>x.apiId===pub.id);
  if(!c){
    c = { id:'api_creator_'+pub.id, apiId: pub.id, name: pub.name, handle:'@'+pub.name.toLowerCase().replace(/[^a-z0-9]/g,''),
      color: gradFor(pub.name), videos:0, sales:0, revenue:0 };
    DB.creators.push(c);
  }
  c.name = pub.name;
  c.followers = pub.followers_count;
  c.level = pub.followers_count>30000?'Icône':pub.followers_count>15000?'Étoile':pub.followers_count>5000?'Influenceur':pub.followers_count>800?'Ambassadeur':'Débutant';
  return c;
}

async function loadCreatorProgress(){
  const u = user();
  if(!u) return null;
  try{
    const progress = await API.creatorProgress();
    progress.partner_shops = (progress.partner_shops||[]).map(s=>{
      const local = DB.shops.find(x=>x.apiId===s.id);
      return local || mapApiShop(s);
    });
    u.creatorProgress = progress;
    persistAndSave();
    return progress;
  }catch(e){ return null; }
}

async function loadFeedFromApi(){
  try{
    const posts = await API.feed();
    const creatorCache = {};
    const mapped = [];
    for(const post of posts){
      let pub = creatorCache[post.creator_id];
      if(!pub){
        try{ pub = await API.publicUser(post.creator_id); creatorCache[post.creator_id] = pub; }catch(e){ continue; }
      }
      const creatorLocal = ensureCreatorLocal(pub);
      const shop = DB.shops.find(s=>s.apiId===post.shop_id);
      const product = shop && post.product_id ? shop.products.find(p=>p.apiId===post.product_id) : null;
      mapped.push({
        id:'api_post_'+post.id, apiId: post.id,
        shopId: shop ? shop.id : null, shopApiId: post.shop_id,
        productName: product ? product.name : (shop ? shop.name : 'Produit'),
        productPrice: product ? product.price : 0, productOld: null, productApiId: product ? product.apiId : null,
        creatorId: creatorLocal.id, creatorApiId: pub.id, creatorName: pub.name, creatorLevel: creatorLocal.level,
        desc: post.caption || '', hashtags: [], music: (shop?shop.name:'KORAA')+' • Son original',
        grad: gradFor((product?product.name:pub.name)+post.id),
        likes: post.likes_count||0, comments: [], shares:0, gifts:0, liked:false, saved:false,
        createdAt: post.created_at,
      });
    }
    DB.posts = mapped;
    persistAndSave();
    if(S.view==='feed' && RENDERERS.feed) RENDERERS.feed();
  }catch(e){
    console.error('KORAA : chargement du fil créateurs impossible.', e);
  }
}

/* ---------------------------------------------------------------------
   PROGRAMME DE FIDÉLITÉ & SPONSORING — RÈGLES DE LANCEMENT
   1) Acheteurs : tous les 10 achats confirmés → un bon de réduction (-10%).
   2) Créateurs : dès 100 abonnés → un retour (commission bonus) sur
      chaque vente déclenchée par leurs publications, en plus de la
      commission de base. Ces règles alimentent aussi le pont ORBIT.
--------------------------------------------------------------------- */
const LOYALTY_ORDERS_STEP = 10;
const LOYALTY_VOUCHER_PCT = 10; // % de réduction du bon
const CREATOR_FOLLOWER_BONUS_THRESHOLD = 100;
const CREATOR_BASE_COMMISSION_RATE = 0.08;
const CREATOR_BONUS_RETURN_RATE = 0.03; // retour additionnel une fois le seuil d'abonnés atteint

function checkLoyaltyMilestones(u){
  if(!Array.isArray(u.vouchers)) u.vouchers=[];
  if(u.stats.orders>0 && u.stats.orders % LOYALTY_ORDERS_STEP === 0){
    const voucher = { id:uid('vch'), code:`KORAA${LOYALTY_VOUCHER_PCT}-${Math.floor(1000+Math.random()*8999)}`, pct:LOYALTY_VOUCHER_PCT, earnedAt:Date.now(), earnedAtOrder:u.stats.orders, used:false };
    u.vouchers.unshift(voucher);
    u.history.unshift({label:`Bon de réduction gagné (-${LOYALTY_VOUCHER_PCT}%) — ${u.stats.orders} achats atteints`, tag:'Fidélité', ts:Date.now()});
    addNotification('gift', `🎁 Félicitations ! ${u.stats.orders} achats = un bon de réduction de ${LOYALTY_VOUCHER_PCT}% (code ${voucher.code})`);
    toast(`🎁 Bon de réduction -${LOYALTY_VOUCHER_PCT}% débloqué !`,'check');
  }
}
/* Taux de commission d'un créateur pour une vente : base + retour bonus dès 100 abonnés. */
function creatorCommissionRate(creatorFollowers){
  return CREATOR_BASE_COMMISSION_RATE + (creatorFollowers>=CREATOR_FOLLOWER_BONUS_THRESHOLD ? CREATOR_BONUS_RETURN_RATE : 0);
}
/* Notifie et débloque le badge la première fois qu'un créateur franchit le seuil des 100 abonnés. */
function checkCreatorFollowerBonus(u){
  if(u.stats.followers>=CREATOR_FOLLOWER_BONUS_THRESHOLD && !u.badges.includes('Retours débloqués')){
    u.badges.push('Retours débloqués');
    addNotification('trophy', `🏆 100 abonnés atteints ! Tu reçois désormais un retour supplémentaire de ${Math.round(CREATOR_BONUS_RETURN_RATE*100)}% sur chaque vente déclenchée par tes publications.`);
    toast('🏆 Retours sur ventes débloqués (100 abonnés) !','check');
  }
}

/* ---------- Partenaires : boutiques qui ont "ouvert leurs portes" au créateur ----------
   Une boutique devient partenaire d'un client dès qu'il y a déjà acheté (commande réelle),
   ou dès qu'il l'ajoute manuellement (ex : produit reçu en cadeau, partenariat direct). */
function partnerShopsOf(u){
  const ids = new Set(u.partners||[]);
  (DB.orders||[]).filter(o=>o.buyerId===u.id).forEach(o=> ids.add(o.shopId));
  return [...ids].map(id=>shopOf(id)).filter(Boolean);
}
function addPartnerShop(shopId){
  const u = user();
  if(!Array.isArray(u.partners)) u.partners=[];
  if(!u.partners.includes(shopId)){

    u.history.unshift({label:`Nouveau partenaire ajouté : ${shopOf(shopId)?.name||''}`, tag:'Partenaire', ts:Date.now()});
    persistAndSave();
    toast('Boutique ajoutée à tes partenaires','check');
  }
}

/* ---------- Camera / MediaRecorder helpers (fonctionnalités réelles du navigateur) ---------- */
function stopMediaStream(stream){ if(stream) stream.getTracks().forEach(tr=>tr.stop()); }
/* ---------- Sheet : Filmer une vidéo (vraie caméra + enregistrement) ---------- */
async function openCameraCaptureSheet(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Caméra indisponible sur cet appareil/navigateur","alert");
    openPublishSheet('camera');
    return;
  }
  openSheet(`
    <div class="sheet-head"><h4>Filmer une vidéo</h4></div>
    <div class="sheet-body" style="padding-top:0;">
      <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:9/16;max-height:52vh;margin:0 auto;">
        <video id="cam-preview" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>
        <div id="cam-rec-badge" style="display:none;position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;align-items:center;gap:6px;"><span class="live-badge-dot"></span> REC <span id="cam-timer">0:00</span></div>
        <div id="cam-error" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-size:12.5px;text-align:center;padding:20px;background:#1c1c1c;"></div>
      </div>
    </div>
    <div class="sheet-foot" style="display:flex;gap:10px;">
      <button class="btn btn-outline" id="cam-cancel" style="flex:1;">Annuler</button>
      <button class="btn btn-gold" id="cam-record" style="flex:2;">${ic('camera',15)} Démarrer l'enregistrement</button>
    </div>`, {maxHeight:'92%'});
  let stream=null, recorder=null, chunks=[], timerInt=null, secs=0, recording=false;
  const videoEl = document.getElementById('cam-preview');
  const recBtn = document.getElementById('cam-record');
  const cancelBtn = document.getElementById('cam-cancel');
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true});
    videoEl.srcObject = stream;
  }catch(e){
    document.getElementById('cam-error').style.display='flex';
    document.getElementById('cam-error').textContent = "Impossible d'accéder à la caméra (permission refusée ou appareil indisponible).";
  }
  function cleanupAndClose(){ stopMediaStream(stream); if(timerInt) clearInterval(timerInt); closeModal(); }
  cancelBtn.addEventListener('click', cleanupAndClose);
  recBtn.addEventListener('click', ()=>{
    if(!stream) return;
    if(!recording){
      chunks=[]; secs=0;
      try{ recorder = new MediaRecorder(stream); }catch(e){ toast('Enregistrement non supporté sur ce navigateur'); return; }
      recorder.ondataavailable = (e)=>{ if(e.data.size>0) chunks.push(e.data); };
      recorder.onstop = ()=>{
        const blob = new Blob(chunks, {type:'video/webm'});
        const url = URL.createObjectURL(blob);
        stopMediaStream(stream); clearInterval(timerInt); closeModal();
        openPublishSheet('camera', url);
      };
      recorder.start();
      recording = true;
      document.getElementById('cam-rec-badge').style.display='flex';
      recBtn.innerHTML = ic('check',15)+' Arrêter et continuer';
      recBtn.classList.remove('btn-gold'); recBtn.classList.add('btn-outline');
      timerInt = setInterval(()=>{ secs++; const m=Math.floor(secs/60), s=secs%60; document.getElementById('cam-timer').textContent = `${m}:${s<10?'0':''}${s}`; if(secs>=60) recorder.stop(); }, 1000);
    } else {
      recorder.stop();
      recording = false;
    }
  });
}

function openGalleryPickSheet(){
  const input = document.createElement('input');
  input.type='file'; input.accept='video/*'; input.style.display='none';
  document.body.appendChild(input);
  input.addEventListener('change', ()=>{
    const file = input.files && input.files[0];
    document.body.removeChild(input);
    if(!file){ return; }
    const url = URL.createObjectURL(file);
    openPublishSheet('gallery', url);
  });
  input.click();
}

    const desc = document.getElementById('pub-desc').value.trim() || 'Nouvelle vidéo KORAA';
    const hashtags = document.getElementById('pub-hashtags').value.split(' ').filter(Boolean);
    const wasCreator = u.isCreator;

    if(!u.badges.includes('Créateur')) u.badges.push('Créateur');

    u.stats.followers += 15+Math.floor(Math.random()*40);
    recalcLevel(u);
    const post = {
      id:uid('post'), shopId:selectedShop.id, productName:product.name, productPrice:product.price, productOld:product.oldPrice||null,
      creatorId:u.id, creatorName:u.name, creatorLevel:u.level,
      desc, hashtags, music:selectedShop.name+' • Son original', grad:gradFor(product.name+Date.now()),
      videoBlobUrl: videoBlobUrl||null, sourceMode: sourceMode||'camera',

    goTo('create');

  });
}
function simulateVideoGrowth(postId){
  let ticks = 0;
  const timer = setInterval(()=>{
    const post = DB.posts.find(p=>p.id===postId);
    if(!post || ticks>=6){ clearInterval(timer); return; }
    ticks++;
    post.likes += 5+Math.floor(Math.random()*30);
    if(Math.random()<0.4){
      const u = user();
      const commission = Math.round(post.productPrice*creatorCommissionRate(u.stats.followers));
      u.stats.revenue += commission; u.stats.commissions += commission; u.stats.salesDone++;
      checkCreatorFollowerBonus(u);
      addNotification('wallet', `Nouvelle vente via ta vidéo « ${post.productName} » — commission ${fmtFCFA(commission)}`);
    }
    persistAndSave();
    if(S.view==='feed') renderFeed();
    if(S.view==='create') renderCreate();
  }, 4000);
}

        <li>Toute commande peut être suivie depuis l'onglet Profil &gt; Tableau de bord &gt; Commandes.</li>
      </ul>

      <h4 style="margin:14px 0 6px;">5. Données &amp; confidentialité</h4>
      <ul style="padding-left:18px;margin:0 0 10px;">
        <li>Les données de compte (nom, contact, historique d'achats) sont utilisées uniquement pour le fonctionnement de la plateforme et le support.</li>
        <li>Aucune donnée n'est revendue à des tiers en dehors de l'écosystème Groupe (ORBIT).</li>
      </ul>

      <h4 style="margin:14px 0 6px;">6. Sanctions</h4>
      <ul style="padding-left:18px;margin:0 0 10px;">
        <li>Tout contenu ou comportement frauduleux (faux avis, fausses ventes, harcèlement) entraîne un avertissement puis, en cas de récidive, la suspension du compte.</li>
      </ul>
    </div>
    <div class="sheet-foot"><button class="btn btn-gold btn-block" id="reglement-close">J'ai compris</button></div>`, {maxHeight:'88%'});
  document.getElementById('reglement-close').addEventListener('click', closeModal);
}

/* ---------- Sheet : Favoris ---------- */
function openFavoritesSheet(defaultTab){
  const u = user();
  let tab = defaultTab || 'products';
  const tabs = [{id:'products',label:'Produits'},{id:'shops',label:'Boutiques'},{id:'videos',label:'Vidéos'},{id:'creators',label:'Créateurs'}];
  openSheet(`
    <div class="sheet-head"><h4>Mes favoris</h4></div>
    <div class="discover-tabs" id="fav-tabs" style="padding:0 18px 12px;">${tabs.map(t=>`<button class="chip ${tab===t.id?'active':''}" data-favt="${t.id}">${t.label}</button>`).join('')}</div>
    <div class="sheet-body" id="fav-body"></div>`, {maxHeight:'80%'});
  function draw(){
    document.querySelectorAll('#fav-tabs [data-favt]').forEach(b=>b.classList.toggle('active', b.dataset.favt===tab));
    const body = document.getElementById('fav-body');
    if(tab==='products'){
      const items = u.favorites.products.map(key=>{ const [shopId,name]=key.split('::'); const s=shopOf(shopId); const p = s?.products.find(x=>x.name===name); return p?{...p,shopId,shopName:s.name,shopColor:s.color}:null; }).filter(Boolean);
      body.innerHTML = items.length? `<div class="product-grid" style="padding:0;">${items.map(p=>productCardHTML(p)).join('')}</div>` : emptyFav();
    } else if(tab==='shops'){
      const items = u.favorites.shops.map(shopOf).filter(Boolean);
      body.innerHTML = items.length? items.map(s=>shopGridCardHTML(s)).join('') : emptyFav();
    } else if(tab==='videos'){
      const items = DB.posts.filter(p=>u.favorites.videos.includes(p.id));
      body.innerHTML = items.length? `<div class="dash-list" style="padding:0;">${items.map(p=>`<div class="dash-row"><div class="dr-icon">${ic('video',16)}</div><div class="dr-label">${p.productName}<br><span style="font-size:11px;color:var(--grey-soft);">${p.creatorName}</span></div></div>`).join('')}</div>` : emptyFav();
    } else {
      const items = u.favorites.creators.map(id=>DB.creators.find(c=>c.id===id)).filter(Boolean);
      body.innerHTML = items.length? `<div class="dash-list" style="padding:0;">${items.map((c,i)=>creatorRowHTML(c,i)).join('')}</div>` : emptyFav();
    }
    body.querySelectorAll('[data-openshop]').forEach(cardEl=>cardEl.addEventListener('click',()=>{ closeModal(); S.activeShopId=cardEl.dataset.openshop; goTo('shop'); }));
    body.querySelectorAll('[data-openprofile]').forEach(rowEl=>rowEl.addEventListener('click',()=>{ closeModal(); openCreatorProfileSheet(rowEl.dataset.openprofile); }));
  }
  function emptyFav(){ return `<div class="empty-state">${ic('heart',28)}<p>Rien ici pour l'instant.</p></div>`; }
  draw();
  document.querySelectorAll('#fav-tabs [data-favt]').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.favt; draw(); }));
}

/* =====================================================================
   VUE : NOTIFICATIONS
   ===================================================================== */
function renderNotifications(){
  const el = document.getElementById('view-notifications');
  const u = user();
  el.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="ntf-back">${ic('chevLeft',18)}</button><div class="brand">Notifications</div></div>
    <div class="view-scroll">
      ${u.notifications.length? u.notifications.map(n=>`
        <div class="notif-row ${n.read?'':'unread'}">
          <div class="nr-icon">${ic(n.icon||'bell',17)}</div>
          <div><div class="nr-text">${n.text}</div><div class="nr-time">${timeAgo(n.ts)}</div></div>
        </div>`).join('') : `<div class="empty-state">${ic('bell',30)}<p>Aucune notification.</p></div>`}
    </div>`;
  document.getElementById('ntf-back').addEventListener('click', ()=>goTo(MAIN_VIEWS.includes(S.lastMain)?S.lastMain:'feed'));
  u.notifications.forEach(n=>n.read=true);
  persistAndSave();
}

/* =====================================================================
   VUE : RECHERCHE
   ===================================================================== */
function renderSearch(){
  const el = document.getElementById('view-search');
  el.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="search-back">${ic('chevLeft',18)}</button>
      <input id="search-input" placeholder="Rechercher..." value="${S.searchQuery}" style="flex:1;padding:11px 16px;border-radius:999px;background:var(--beige-light);border:1px solid var(--line);font-size:13.5px;">
    </div>
    <div class="view-scroll" id="search-results"></div>`;
  document.getElementById('search-back').addEventListener('click', ()=>goTo(MAIN_VIEWS.includes(S.lastMain)?S.lastMain:'discover'));
  const input = document.getElementById('search-input');
  setTimeout(()=>input.focus(), 60);
  input.addEventListener('input', ()=>{ S.searchQuery = input.value; drawResults(); });
  function drawResults(){
    const q = S.searchQuery.trim().toLowerCase();
    const results = document.getElementById('search-results');
    if(!q){ results.innerHTML = `<div class="empty-state">${ic('search',30)}<p>Recherche des boutiques, créateurs,<br>produits ou hashtags.</p></div>`; return; }
    const shops = DB.shops.filter(s=>s.name.toLowerCase().includes(q)||s.cat.toLowerCase().includes(q));
    const creators = DB.creators.filter(c=>c.name.toLowerCase().includes(q));
    const products = allProducts().filter(p=>p.name.toLowerCase().includes(q));
    let html='';
    if(shops.length) html += `<div class="section-row"><h3>Boutiques</h3></div><div class="product-grid" style="grid-template-columns:1fr 1fr;">${shops.map(s=>shopGridCardHTML(s)).join('')}</div>`;
    if(creators.length) html += `<div class="section-row"><h3>Créateurs</h3></div><div class="dash-list">${creators.map((c,i)=>creatorRowHTML(c,i)).join('')}</div>`;
    if(products.length) html += `<div class="section-row"><h3>Produits</h3></div><div class="product-grid">${products.map(p=>productCardHTML(p)).join('')}</div>`;
    if(!shops.length && !creators.length && !products.length) html = `<div class="empty-state">${ic('search',30)}<p>Aucun résultat pour « ${S.searchQuery} ».</p></div>`;
    results.innerHTML = html;
    results.querySelectorAll('[data-openshop]').forEach(cardEl=>cardEl.addEventListener('click',()=>{ S.activeShopId=cardEl.dataset.openshop; goTo('shop'); }));
    results.querySelectorAll('[data-openprofile]').forEach(rowEl=>rowEl.addEventListener('click',()=>openCreatorProfileSheet(rowEl.dataset.openprofile)));
  }
  drawResults();
}

/* =====================================================================
   VUE : SPONSORING
   ===================================================================== */
function renderSponsor(){
  const el = document.getElementById('view-sponsor');
  const u = user();
  el.innerHTML = `
    <div class="topbar"><button class="icon-btn" id="spon-back">${ic('chevLeft',18)}</button><div class="brand">Sponsoring</div></div>
    <div class="sponsor-mode-toggle">
      <button class="${S.sponsorMode==='creator'?'active':''}" data-sponsormode="creator">Espace créateur</button>
      <button class="${S.sponsorMode==='business'?'active':''}" data-sponsormode="business">Espace entreprise</button>
    </div>
    <div class="view-scroll" id="sponsor-body"></div>`;
  document.getElementById('spon-back').addEventListener('click', ()=>goTo(u.isCreator?'create':'discover'));
  el.querySelectorAll('[data-sponsormode]').forEach(b=>b.addEventListener('click',()=>{ S.sponsorMode=b.dataset.sponsormode; renderSponsor(); }));
  const body = document.getElementById('sponsor-body');
  if(S.sponsorMode==='creator'){
    const bonusActive = u.stats.followers>=CREATOR_FOLLOWER_BONUS_THRESHOLD;
    body.innerHTML = `
      <div class="creator-hero" style="margin-top:2px;">
        <h3>${ic('gift',18)} Règles du programme de lancement</h3>
        <p>Tous les ${LOYALTY_ORDERS_STEP} achats, un client reçoit un bon de réduction de ${LOYALTY_VOUCHER_PCT}%. Dès ${CREATOR_FOLLOWER_BONUS_THRESHOLD} abonnés, toi en tant que créateur tu reçois en plus un retour de ${Math.round(CREATOR_BONUS_RETURN_RATE*100)}% sur chaque vente déclenchée par tes vidéos (en plus de ta commission de base de ${Math.round(CREATOR_BASE_COMMISSION_RATE*100)}%).</p>
        <div class="chip" style="margin-top:8px;${bonusActive?'':'opacity:.6;'}">${bonusActive?'✅ Retour bonus actif':`🔒 Encore ${CREATOR_FOLLOWER_BONUS_THRESHOLD-u.stats.followers} abonnés avant le retour bonus`}</div>
      </div>
      <div class="section-row"><h3>Campagnes ouvertes</h3><span class="see-all">${DB.sponsorCampaigns.filter(c=>c.status==='open').length} actives</span></div>
      ${DB.sponsorCampaigns.map(c=>campaignCardHTML(c,'creator')).join('')}`;
  } else {
    body.innerHTML = `
      <div class="creator-hero" style="margin-top:2px;">
        <h3>${ic('building',18)} Recruter des créateurs</h3>
        <p>Recherchez des créateurs par statistiques et lancez une campagne de collaboration.</p>
      </div>
      <div class="section-row"><h3>Meilleurs profils disponibles</h3></div>
      <div class="dash-list">${DB.creators.slice(0,6).map((c,i)=>creatorRowHTML(c,i)).join('')}</div>
      <div class="section-row"><h3>Vos campagnes</h3><button class="see-all" id="new-campaign-btn" style="background:none;color:var(--gold-dark);font-weight:700;">+ Nouvelle</button></div>
      ${DB.sponsorCampaigns.map(c=>campaignCardHTML(c,'business')).join('')}`;
    document.getElementById('new-campaign-btn').addEventListener('click', openNewCampaignSheet);
  }
  body.querySelectorAll('[data-apply]').forEach(btn=>btn.addEventListener('click', ()=>{
    const camp = DB.sponsorCampaigns.find(c=>c.id===btn.dataset.apply);
    camp.applied = Math.min(camp.slots, camp.applied+1);
    persistAndSave();
    toast('Candidature envoyée !','check');
    addNotification('megaphone', `Candidature envoyée pour la campagne « ${camp.title} »`);
    renderSponsor();
  }));
  body.querySelectorAll('[data-openprofile]').forEach(rowEl=>rowEl.addEventListener('click',()=>openCreatorProfileSheet(rowEl.dataset.openprofile)));
}
function campaignCardHTML(c, mode){
  const s = shopOf(c.shopId);
  return `
  <div class="campaign-card">
    <div class="cc-top"><span class="cc-title">${escapeHtml(c.title)}</span><span class="cc-status ${c.status==='open'?'open':'review'}">${c.status==='open'?'Ouverte':'En revue'}</span></div>
    <div class="cc-desc">${escapeHtml(c.desc)}</div>
    <div class="cc-meta">
      <span>${s.name}</span><span>Budget ${fmtFCFA(c.budget)}</span><span>${c.applied}/${c.slots} places</span>
    </div>
    ${mode==='creator' && c.status==='open' ? `<button class="btn btn-gold btn-sm" style="margin-top:12px;" data-apply="${c.id}">Postuler</button>` : ''}
  </div>`;
}
function openNewCampaignSheet(){
  openSheet(`
    <div class="sheet-head"><h4>Nouvelle campagne</h4></div>
    <div class="sheet-body">
      <div class="field"><label>Boutique</label><select id="nc-shop">${DB.shops.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
      <div class="field"><label>Titre de la campagne</label><input id="nc-title" placeholder="Ex : Lancement collection"></div>
      <div class="field"><label>Description</label><textarea id="nc-desc" rows="3" placeholder="Objectif, format attendu..."></textarea></div>
      <div class="field-row">
        <div class="field"><label>Budget (FCFA)</label><input id="nc-budget" type="number" value="100000"></div>
        <div class="field"><label>Places créateurs</label><input id="nc-slots" type="number" value="5"></div>
      </div>
    </div>
    <div class="sheet-foot"><button class="btn btn-gold btn-block" id="nc-confirm">Lancer la campagne</button></div>`);
  document.getElementById('nc-confirm').addEventListener('click', ()=>{
    const title = document.getElementById('nc-title').value.trim() || 'Nouvelle campagne';
    DB.sponsorCampaigns.unshift({
      id:uid('camp'), shopId:document.getElementById('nc-shop').value, title,
      desc:document.getElementById('nc-desc').value.trim()||'—', status:'open',
      budget:Number(document.getElementById('nc-budget').value)||0, slots:Number(document.getElementById('nc-slots').value)||1, applied:0,
    });
    persistAndSave(); closeModal(); toast('Campagne publiée','check'); renderSponsor();
  });
}

/* =====================================================================
   ENREGISTREMENT DES VUES + SIMULATION TEMPS REEL + BOOTSTRAP
   ===================================================================== */
Object.assign(RENDERERS, {
  feed: renderFeed, discover: renderDiscover, shop: renderShop, create: renderCreate,
  messages: renderMessages, chat: renderChat, profile: renderProfile,
  notifications: renderNotifications, search: renderSearch, sponsor: renderSponsor,
});

const LIVE_EVENTS = [
  {icon:'heart', text:()=>`${DB.creators[Math.floor(Math.random()*DB.creators.length)].name} a aimé une vidéo que tu suis`},
  {icon:'users', text:()=>`Nouveau créateur tendance : ${DB.creators[Math.floor(Math.random()*DB.creators.length)].name}`},
  {icon:'tag', text:()=>`Nouvelle promotion chez ${DB.shops[Math.floor(Math.random()*DB.shops.length)].name}`},
];
let liveTimer = null;
function startLiveSimulation(){
  if(liveTimer) return;
  liveTimer = setInterval(()=>{
    if(!DB.user) return;
    if(document.hidden) return;
    if(!DB.creators.length || !DB.shops.length) return; // pas d'événement simulé tant qu'il n'y a pas de vrais comptes/boutiques
    const ev = LIVE_EVENTS[Math.floor(Math.random()*LIVE_EVENTS.length)];
    addNotification(ev.icon, ev.text());
    if(S.view==='feed' || S.view==='profile') { document.querySelectorAll('.icon-btn .badge-dot').length; }
    // rafraîchit juste le badge de notif sans re-render complet intrusif
    document.querySelectorAll('#feed-bell-btn, #prof-bell').forEach(btn=>{
      if(!btn.querySelector('.badge-dot')) btn.insertAdjacentHTML('beforeend','<span class="badge-dot"></span>');
    });
  }, 18000);
}

/* ---------------------------------------------------------------------
   BOOTSTRAP
--------------------------------------------------------------------- */
function initApp(){
  loadDB();
  renderBottomNav();
  if(DB.user && getToken()){
    // Une session locale existe : on vérifie qu'elle est toujours valide côté
    // serveur (le token peut avoir expiré, ou la base avoir été réinitialisée)
    // et on rafraîchit au passage les compteurs réels (achats, abonnés, statut créateur).
    document.getElementById('view-auth').classList.remove('active');
    document.getElementById('app-shell').classList.remove('hidden');
    goTo('feed');
    startLiveSimulation();
    loadShopsFromApi();
    API.me().then(serverUser=>hydrateSessionFromApi(serverUser)).catch(()=>{
      DB.user = null; clearToken(); persistAndSave();
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('view-auth').classList.add('active');
      S.authMode='login';
      renderAuth();
      toast('Session expirée, reconnecte-toi.');
    });
  } else if(DB.user && !getToken()){
    // Ancien compte local (créé avant le branchement API) sans session serveur valide.
    DB.user = null;
    renderAuth();
  } else {
    renderAuth();
  }
}
document.addEventListener('DOMContentLoaded', initApp);

// Synchronisation live entre onglets : si la base KORAA change dans un
// autre onglet/fenêtre du même navigateur (reconnexion, achat, message...),
// on recharge la donnée et on redessine la vue courante, sans recharger
// la page — pour une union robuste et permanente entre les surfaces KORAA/ORBIT.
window.addEventListener('storage', (e)=>{
  if(e.key === DB_KEY){
    try{
      loadDB();
      if(RENDERERS[S.view]) RENDERERS[S.view]();
      if(MAIN_VIEWS.includes(S.view)) renderBottomNav();
    }catch(err){ /* re-rendu impossible pour l'instant, on ignore silencieusement */ }
  }
});
</script>
